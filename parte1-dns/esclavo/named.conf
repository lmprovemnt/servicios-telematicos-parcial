include "/etc/bind/keys/esclavo.key";

options {
    directory "/var/cache/bind";

    listen-on {
        127.0.0.1;
        192.168.50.3;
    };

    listen-on-v6 {
        ::1;
    };

    recursion no;

    allow-query {
        192.168.50.0/24;
    };

    allow-transfer {
        none;
    };
};

zone "empresa.local" {
    type slave;

    masters {
        192.168.50.2 key "esclavo-transfer";
    };

    file "/var/cache/bind/db.empresa.local";
};

zone "50.168.192.in-addr.arpa" {
    type slave;

    masters {
        192.168.50.2 key "esclavo-transfer";
    };

    file "/var/cache/bind/db.192.168.50";
};
